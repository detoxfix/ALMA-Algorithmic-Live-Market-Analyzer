name: Update sinyal saham AS harian

on:
  schedule:
    - cron: "30 22 * * 1-5"      # 22:30 UTC Senin-Jumat = 05:30 WIB Selasa-Sabtu (setelah bursa AS tutup)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alma
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependensi
        run: pip install -r requirements.txt

      - name: Jalankan mesin sinyal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSITIONS_CSV: ${{ secrets.POSITIONS_CSV }}
        run: |
          # posisi pribadi disimpan sebagai secret (tidak pernah masuk repo publik)
          if [ -n "$POSITIONS_CSV" ]; then printf '%s\n' "$POSITIONS_CSV" > positions.csv; fi
          python main.py --backtest auto
          rm -f positions.csv
          touch docs/.nojekyll

      - name: Simpan hasil ke repo
        run: |
          git config user.name "alma-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git commit -m "Sinyal $(TZ=Asia/Jakarta date +%F)" || echo "Tidak ada perubahan"
          git pull --rebase
          git push

      - name: Kabari Telegram bila gagal
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TOKEN" ] && exit 0
          for c in ${CHAT//,/ }; do
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$c" --data-urlencode text="Update sinyal ALMA GAGAL. Lihat: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
